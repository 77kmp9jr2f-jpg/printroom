# Set PRINT_LAN_HOST in .env AND lanHost in config/printers.json to the same address.
# Use with -f compose.portable.yaml -f compose.lan.yaml. Keep paired access by default.
services:
  companion:
    ports:
      - "${PRINT_LAN_HOST:?Set PRINT_LAN_HOST to the service host private IPv4}:${PRINT_PUBLIC_PORT:-7988}:8081"
  camera:
    ports:
      - "${PRINT_LAN_HOST:?Set PRINT_LAN_HOST}:18555:8555/tcp"
      - "${PRINT_LAN_HOST:?Set PRINT_LAN_HOST}:18555:8555/udp"
